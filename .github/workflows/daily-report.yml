# Send the daily price report email, on demand.
# Manual trigger only: Vercel Cron sends it every day (vercel.json).
name: Daily Report

on:
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily report
        run: |
          curl -X POST "${{ secrets.APP_URL }}/api/cron/daily-report" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            --fail-with-body \
            --max-time 120
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
