# Re-check prices for all tracked products, on demand.
# Manual trigger only: Vercel Cron is the scheduler (vercel.json). A second
# scheduler here would double the daily request volume to every store.
name: Price Check

on:
  workflow_dispatch:

jobs:
  fetch-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger price fetch
        run: |
          curl -X POST "${{ secrets.APP_URL }}/api/cron/fetch-prices" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            --fail-with-body \
            --max-time 300
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
